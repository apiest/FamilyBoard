add_event:
  name: Add calendar event
  description: >-
    Create a calendar event using the FamilyBoard add-event form entities
    (select.familyboard_event_member, select.familyboard_event_calendar,
    text.familyboard_event_title, switch.familyboard_event_all_day,
    datetime.familyboard_event_start, datetime.familyboard_event_end,
    datetime.familyboard_day_start, datetime.familyboard_day_end).
    Reads the current entity states, creates the event on the matching
    member calendar, and resets the form.

add_meal:
  name: Add meal
  description: >-
    Create an all-day meal event in the configured meal_calendar from the
    add-event form entities (text.familyboard_event_title,
    datetime.familyboard_day_start). Resets the title afterwards. Requires
    `meal_calendar` to be set in the FamilyBoard options.

snooze_test:
  name: Test snooze reminder
  description: >-
    Force-fire a snooze notification for a given task uid (for testing).
  fields:
    uid:
      name: Task UID
      description: The Google Tasks uid of the task to fire a reminder for.
      required: true
      example: "RE5QaTNIeEhaLS1xQm83OA"
      selector:
        text:

cancel_reminder:
  name: Cancel snooze reminder
  description: >-
    Cancel an active snooze reminder for a given task uid.
  fields:
    uid:
      name: Task UID
      description: The Google Tasks uid of the reminder to cancel.
      required: true
      example: "RE5QaTNIeEhaLS1xQm83OA"
      selector:
        text:

suggest_meal:
  name: Suggest meal
  description: >-
    Generate a meal suggestion via ai_task.generate_data using the
    configured meal_planner block. Stores the result on
    sensor.familyboard_meal_suggestion.
  fields:
    date:
      name: Target date
      description: The date the meal is for. Defaults to today.
      example: "2026-04-30"
      selector:
        date:
    ai_task_entity:
      name: AI task entity
      description: >-
        One-shot override of the configured ai_task_entity. Useful to
        try a different model without changing options.
      example: ai_task.gpt_oss_20b
      selector:
        entity:
          domain: ai_task

accept_meal_suggestion:
  name: Accept meal suggestion
  description: >-
    Apply the stored suggestion: create an all-day event on the
    configured meal_calendar for its date and append each ingredient to
    the configured shopping_list (when set).

clear_meal_suggestion:
  name: Clear meal suggestion
  description: Discard the current meal suggestion without acting on it.
